server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Приложение обращается к API по относительному пути /api/...
    # Порт api наружу не публикуется — доступ только по сети compose.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Схема API (Swagger). В проде закрывается переменной DOCS_ENABLED=false.
    location = /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Хешированные ассеты (vite) неизменны — можно кешировать надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html и остальная статика — без кеша, чтобы после деплоя
    # браузер не отдавал старую версию приложения.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
