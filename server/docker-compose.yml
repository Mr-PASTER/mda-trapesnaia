# Postgres + backend. Все компоненты — сервисами на одном сервере.
services:
  db:
    image: postgres:16
    container_name: mda_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mda
      POSTGRES_PASSWORD: mda
      POSTGRES_DB: mda
      TZ: Europe/Moscow
    ports:
      - "5432:5432"
    volumes:
      - mda_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mda -d mda"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: mda_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://mda:mda@db:5432/mda
      TZ: Europe/Moscow
      SESSION_TTL_DAYS: "7"
      SEED_OPERATOR_LOGIN: operator
      SEED_OPERATOR_PASSWORD: changeme
    ports:
      - "8000:8000"

volumes:
  mda_pgdata:
